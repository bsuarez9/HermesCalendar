version: '3.8'

services:
  # Base de datos PostgreSQL
  db:
    image: postgres:15-alpine
    container_name: calendario-ypf-db
    environment:
      POSTGRES_USER: calendario_user
      POSTGRES_PASSWORD: calendario_pass
      POSTGRES_DB: calendario_ypf
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U calendario_user"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend FastAPI
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: calendario-ypf-backend
    environment:
      - DATABASE_URL=postgresql://calendario_user:calendario_pass@db:5432/calendario_ypf
      - EXCEL_FILE_PATH=/app/data/Calendario_Argentina_2026_Completo.xlsx
      - ALLOWED_ORIGINS=http://localhost:5173,http://localhost:3000
      - DEBUG=True
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./Calendario_Argentina_2026_Completo.xlsx:/app/data/Calendario_Argentina_2026_Completo.xlsx:ro
    depends_on:
      db:
        condition: service_healthy
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  # Frontend React
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: calendario-ypf-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_BASE_URL=http://localhost:8000/api/v1
    depends_on:
      - backend
    command: npm run dev -- --host 0.0.0.0

volumes:
  postgres_data:
